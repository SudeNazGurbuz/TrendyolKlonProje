        <main>
            <section id="auth-section">
                <div class="auth-container">
                 <!-- Giriş Yap Formu -->
                    <div class="auth-box">
                        <h2>Giriş Yap</h2>
                        <form id="login-form">
                            <input type="text" id="login-username" placeholder="Kullanıcı Adı" required><br>
                            <input type="password" id="login-password" placeholder="Şifre" required><br>
                            <button type="submit">Giriş Yap</button>
                        </form>
                    </div>

                <!-- Kayıt Ol Formu -->
                    <div class="auth-box">
                        <h2>Kayıt Ol</h2>
                        <form id="register-form">
                            <input type="text" id="register-username" placeholder="Kullanıcı Adı" required><br>
                            <input type="email" id="register-email" placeholder="E-posta" required><br>
                            <input type="password" id="register-password" placeholder="Şifre" required><br>
                            <input type="password" id="register-password2" placeholder="Şifreyi Tekrar" required><br>
                            <button type="submit">Kayıt Ol</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>
